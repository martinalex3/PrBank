<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/images/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="assets/theme/css/styles.css">
  <link rel="alternate stylesheet" href="assets/theme/css/styles2.css" title="Modo Oscuro">
  <title>PrBank - Panel</title>
</head>
<body>

  <!-- HEADER -->
  <header class="header-bar">
    <div class="header-content">
      <h1>PrBank</h1>
      <span class="logout-link" onclick="logout()">Sign Out</span>
    </div>
  </header>

  <!-- MENSAJE DE BIENVENIDA -->
  <section class="bienvenida">
    <h2>Welcome to PrBank, @user.</h2>
    <p>Manage your accounts and transactions.</p>
  </section>

  <!-- MENÚ PRINCIPAL -->
  <main class="menu-container">

    <div class="card" onclick="window.location.href='myaccounts.html'">
      <img src="assets/images/accounts.png" alt="Cuentas">
      <p>Accounts</p>
    </div>
    <div class="card" onclick="window.location.href='changepw.html'">
      <img src="assets/images/changepw.png" alt="Cambiar contraseña">
      <p>Change Password</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 PrBank. All Rights Reserved.</p>
    <p>Alejandro Martín, Kenneth León, David Aranda.</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    function logout() {
      // Aquí puedes limpiar sesión si lo necesitas
      // localStorage.clear();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
