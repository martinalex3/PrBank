<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/theme/images/icon.png" type="image/x-icon">
    <title>Movimientos - PrBank</title>

    <!-- CSS unificado -->
    <link rel="stylesheet" href="assets/theme/css/styles.css">

    <!-- JS Original -->
    <script src="assets/theme/js/mymovements.js"></script>
    <script src="assets/theme/js/model.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="header-bar">
        <div class="header-content">
            <h1>PrBank</h1>

            <div class="header-actions">
                <!--<span class="nav-link" onclick="goToAccounts()">Cuentas</span>-->
                <span class="logout-link" onclick="logout()">Volver al Inicio</span>
            </div>
        </div>
    </header>

    <!-- BIENVENIDA -->
    <section class="bienvenida">
        <h2>Bienvenido a tus movimientos</h2>
        <p>Realiza movimientos de manera segura.</p>
    </section>

    <main>
        <div class="contenedor-central">
            <div class="recuadro-principal" style="width: 95%; flex-direction: column;">
                <div style="text-align: right; width: 100%; margin-bottom: 15px;">
                    <button id="btnOpen" class="iniciar" style="width:auto; padding:10px 20px;">
                        + Nuevo Movimiento
                    </button>
                </div>
                <table class="tabla-bancaria">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>TimeStamp</th>
                            <th>Amount</th>
                            <th>Balance</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        <!-- FORMULARIO -->
        <div id="formLayer" class="capa-overlay" style="display:none;">
            <div class="recuadro-principal">
                <h3>Crear Nueva Cuenta</h3>

                <form id="formAccount">
                    <input type="text" id="tfDesc" placeholder="Descripción" required
                           style="width:100%; margin-bottom:10px; padding:10px;">

                    <input type="number" id="tfBalance" placeholder="0.00" step="0.01" required
                           style="width:100%; margin-bottom:10px; padding:10px;">

                    <select id="selType" style="width:100%; margin-bottom:20px; padding:10px;">
                        <option value="STANDARD">STANDARD</option>
                        <option value="CREDIT">CREDIT</option>
                    </select>

                    <div class="botones">
                        <button type="submit" class="iniciar">Guardar</button>
                        <button type="button" id="btnClose" class="cancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- JS DE NAVEGACIÓN -->
    <script>
        function logout() {
            window.location.href = "index.html";
        }
        /*function goToAccounts() {
            window.location.href = "myaccounts.html";
        }*/
    </script>
</body>
</html>
