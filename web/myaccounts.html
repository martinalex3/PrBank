<!DOCTYPE html>
<!--TODO: Añadir CSS alternativa-->
<!--TODO: Hacer la tabla de cuentas responsiva (no es válido mostrar simplemente scroll horizontal)-->

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/theme/images/icon.png" type="image/x-icon">
    <title>Cuentas - PrBank</title>
    <link rel="stylesheet" href="assets/theme/css/styles.css" id="theme-link">
    <script src="assets/h5p-player/main.bundle.js"></script>
    <script src="assets/theme/js/myaccounts.js"></script>
    <script src="assets/theme/js/model.js"></script>
</head>
<body>

    <header class="header-bar">
        <nav role="navigation" aria-label="main navigation">
            <div class="header-content">
                <h1>PrBank</h1>
                <div class="header-actions">
                    <button class="header-link" onclick="goHome()">Return to Main</button>
                    <button class="logout-link" onclick="logout()">Sign Out</button>
                </div>
            </div>
        </nav>
    </header>

    <div class="zona-herramientas">
    <button class="help-link">Need Help?</button>
    <button id="boton-estilo" onclick="intercambiarTema()">Change Theme</button>
</div>

    <section class="bienvenida">
        <h2>Welcome, <span id="userNameDisplay">User</span>!</h2> 
        <p>Manage your accounts securely.</p>
    </section>
        
    <main>
        <div class="total-balance" style="padding: 20px; text-align: right; font-size: 1.2em;">
            <strong>Global balance: </strong> <span id="totalBalanceTop">0,00 €</span>
        </div>
                
        <div class="contenedor-central">
            <div class="recuadro-principal" style="width: 95%; flex-direction: column;">
                <div style="text-align: left; width: 100%; margin-bottom: 15px;">
                    <button id="btnNuevaCuenta" class="iniciar">+ New account</button>
                </div>

                <table class="tabla-bancaria" role ="table" aria-label="Accounts Table">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Description</th>
                            <th scope="col">Type</th>
                            <th scope="col">Credit Line</th>
                            <th scope="col">Timestamp</th>
                            <th scope="col">Begin Balance</th>
                            <th scope="col">Balance</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="total-balance" style="padding: 20px; text-align: right; font-size: 1.2em;">
                    <strong>Global balance: </strong> <span id="totalBalanceBottom">0,00 €</span>
                </div>
            </div>
        </div>

        <div id="formLayer" class="capa-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="newaccountTitle">
            <div class="recuadro-principal" style="max-width: 420px;">
                <h3 id="newaccountTitle">Account Details</h3>
                <form id="formAccount">
                    <div style="margin-bottom:12px;">
                        <label for="description">Description:</label>
                        <input type="text" id="description" required style="width:100%; padding:8px;">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label for="balance">Initial Balance:</label>
                        <input type="text" id="balance" required style="width:100%; padding:8px;">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label for="type">Account Type:</label>
                        <select id="type" style="width:100%; padding:8px;">
                            <option value="0">STANDARD</option>
                            <option value="1000">CREDIT</option>
                        </select>
                    </div>
                    <div id="creditLineContainer" style="display: none;">
                         <label for="creditLineInput">Credit Line:</label>
                         <input type="text" id="creditLineInput" style="width:100%; padding:8px;">
                    </div>
                    <div class="botones">
                        <button type="submit" class="iniciar">Save</button>
                        <button type="button" id="btnClose" class="cancelar">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="videoLayer" class="capa-overlay" style="display:none;">
            <div class="recuadro-principal" style="max-width: 900px; width: 95%;">
                <h3>Help & Tutorial</h3>
                <div id="h5p-container" style="width: 100%; min-height: 500px; background: #eee;"></div>
                <div class="botones" style="margin-top: 15px;">
                    <button type="button" id="btnCloseVideo" class="cancelar">Close Help</button>
                </div>
            </div>
        </div>
    </main>

    <script>
    function goHome() { window.location.href = "mymain.html"; }
    function logout() { sessionStorage.clear(); window.location.href = "index.html"; }  
    function intercambiarTema() {
        var hoja = document.getElementById("theme-link");
        if (hoja.href.indexOf("styles2.css") !== -1) {
            hoja.href = "assets/theme/css/styles.css";
        } else {
            hoja.href = "assets/theme/css/styles2.css";
        }
    }
</script>
</body>
</html>
