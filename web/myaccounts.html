<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/theme/images/icon.png" type="image/x-icon">
    <title>Cuentas - PrBank</title>
    <link rel="stylesheet" href="assets/theme/css/styles.css">
    <script src="assets/theme/js/myaccounts.js"></script>
    <script src="assets/theme/js/model.js"></script>
</head>
<body>

    <header class="header-bar">
        <div class="header-content">
            <h1>PrBank</h1>
            <span class="header-link" onclick="goHome()" style="cursor:pointer;">Main Index</span>
            <div class="header-actions">
                <span class="logout-link" onclick="logout()" style="cursor:pointer;">Sign Out</span>
            </div>
        </div>
    </header>

    <section class="bienvenida">
        <h2>Welcome to your accounts</h2>
        <p>Manage your accounts securely.</p>
    </section>

    <main>
        <div class="contenedor-central">
            <div class="recuadro-principal" style="width: 100%; flex-direction: column;">
                
                <div style="text-align: left; width: 100%; margin-bottom: 15px;">
                    <button id="btnNuevaCuenta" class="iniciar">
                        + New account
                    </button>
                </div>

                <table class="tabla-bancaria">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Credit Line</th>
                            <th>Timestamp</th>
                            <th>Begin Balance</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="formLayer" class="capa-overlay" style="display:none;">
            <div class="recuadro-principal" style="max-width: 420px;">
                <h3>Create new account</h3>
                <form id="formAccount">
                    <input type="text" id="description" placeholder="Account description" required style="width:100%; margin-bottom:12px; padding:10px;">
                    <input type="number" id="balance" placeholder="Initial balance" required style="width:100%; margin-bottom:12px; padding:10px;">
                    <select id="type" style="width:100%; margin-bottom:20px; padding:10px;">
                        <option value="0">STANDARD</option>
                        <option value="1000">CREDIT</option>
                    </select>
                   <div id="creditLineContainer" style="display: none;">
                         <label>Credit Line Amount:</label>
                         <input type="number" id="creditLineInput" step="0.01" min="0.01" placeholder="Must be greater than 0" style="width:100%; margin-bottom:12px; padding:10px;">
                    </div>
                    <div class="botones">
                        <button type="submit" class="iniciar">Guardar</button>
                        <button type="button" id="btnClose" class="cancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        function goHome() {
            window.location.href = "index.html";
        }
        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
